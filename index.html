<!DOCTYPE html>
<!--
TOSSUP LAND - STANDING RULES (read before editing; every future change must keep all ten)
 1. NO TEXT in enemy attacks or in the arena. Only exception: Word Storm, which flies words taken from the question.
 2. Each enemy uses ONE strong attack per turn. Only the Grand Inquisitor may use several (2, then 3 below half HP).
    Island bosses may fire the same attack twice as an echo. In group fights every living enemy uses its own distinct move,
    and its sprite lunges and flashes when it fires.
 3. Attacks hit hard and bosses are dangerous.
 4. No attack may be beaten by standing still. Medusa's Gaze alternates a blue eye (freeze) and a red eye (keep moving).
 5. Enemy sprites are never drawn inside the arena.
 6. Attack graphics stay pixelated (half-res canvas, nearest-neighbour upscale).
 7. Attacks end with a pixel flicker and dissolve.
 8. Pixel buzzer: presses on Space, goes grey, returns to red on a neg or wrong answer, and fires red pixel lines at the target
    on a correct or power answer. In group fights the player picks the target.
 9. At 0 HP: cut to black, the hero hops and falls off screen (Mario death), then fade to the lab with HP restored.
10. Graphics and music quality matter a lot: one coherent pixel style, one limited palette per island, one consistent font.
-->

function mkDlg(m,plan){const nm=m.nm||'?',pt=nm.split(' '),spc=pt[0],suf=pt[pt.length-1],fx=s=>s.replace(/\{p\}/g,P.name||'Hero').replace(/\{e\}/g,nm),r=Math.random();let L=[dpick(RS=='neg'?D.neg:D.dead)],f;
if(m.i<0)f=dpick(m.mh<m.mx*.5?D.finalLow:D.final);
else if(m.boss){const bl=(m.secret?D.sec[m.nm]:D.boss[m.i])||D.bossg;if(m.mh<m.mx*.5&&!F.p2){F.p2=1;L=['* '+nm+' is getting serious!',dpick(D.p2)]}else f=m.mh<m.mx*.3&&r<.7?dpick(D.bossLow):r<.2?dpick(D.bossg):r<.3?dpick(D.bossMid):dpick(bl)}
else{const gl=D.gm[m.gm];if(r<.02)f=dpick(D.rare);else if(r<.045)f=dpick(D.irare);else if(m.mh<m.mx*.25&&r<.5)f=dpick(D.low);else if(hp<35&&r<.5)f=dpick(D.pl);else if(gl&&r<.6)f=dpick(gl);else if(D.spc[spc]&&r<.8)f=dpick(D.spc[spc]);else if(D.suf[suf]&&r<.9)f=dpick(D.suf[suf]);else f=dpick(D.isl[m.i]||D.isl[0])}
if(f)L.push(f);
if(Math.random()<1/150)L=[dpick(D.ultra)];
const a=MV[plan[0]],b=plan[1]&&MV[plan[1]];L.push('* '+nm+' uses '+a.l+(b?' ...then '+b.l:'')+' '+a.t);
return L.map(fx)}
